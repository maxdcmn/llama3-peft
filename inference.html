<!doctype html>
<html>
  <head>
    <title>LLM Chat</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      #container {
        width: 100%;
        max-width: 700px;
        border: 1px solid #ddd;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 600px;
        margin: auto;
      }
      #endpoint {
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ddd;
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        margin-bottom: 10px;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      #chat::-webkit-scrollbar {
        display: none;
      }
      .message {
        margin-bottom: 15px;
      }
      .user {
        text-align: right;
      }
      .assistant {
        text-align: left;
      }
      .bubble {
        display: inline-block;
        padding: 10px 15px;
        max-width: 70%;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
        font-family: sans-serif;
      }
      .user .bubble {
        background: #007bff;
        color: white;
      }
      .assistant .bubble {
        background: #e9ecef;
        color: #333;
      }
      #input-area {
        display: flex;
        gap: 10px;
      }
      #prompt {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
      }
      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <input
        type="text"
        id="endpoint"
        placeholder="API URL (leave empty for /api)"
      />
      <div id="chat"></div>
      <div id="input-area">
        <input
          type="text"
          id="prompt"
          placeholder="Type a message..."
          onkeypress="if(event.key==='Enter') run()"
        />
        <button onclick="run()">Send</button>
      </div>
    </div>

    <script>
      function addMessage(text, isUser) {
        const chat = document.getElementById("chat");
        const msg = document.createElement("div");
        msg.className = "message " + (isUser ? "user" : "assistant");
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        msg.appendChild(bubble);
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
      }

      async function run() {
        const endpoint = document.getElementById("endpoint").value || "/api";
        const prompt = document.getElementById("prompt").value;

        if (!prompt.trim()) return;

        addMessage(prompt, true);
        document.getElementById("prompt").value = "";
        const bubble = addMessage("", false);

        const url = endpoint + "?input=" + encodeURIComponent(prompt);
        const response = await fetch(url);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          bubble.textContent += decoder.decode(value);
          document.getElementById("chat").scrollTop =
            document.getElementById("chat").scrollHeight;
        }
      }
    </script>
  </body>
</html>
