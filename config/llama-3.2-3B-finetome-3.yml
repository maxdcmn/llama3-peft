# Model Configuration
model_id: meta-llama/Llama-3.2-3B-Instruct
config_name: llama-3.2-3B-finetome-3

dataset_id: mlabonne/FineTome-100k # "local:path.jsonl" for local datasets
dataset_split: train

# LoRA Adapter Configuration
# Trial 3: Aggressive LR (3e-4) with cosine scheduler - only changes from baseline
lora_rank: 16
lora_alpha: 32
lora_dropout_rate: 0.05
lora_targets:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Sequence and batch configuration
sequence_length: 2048
batch_size_per_device: 1
gradient_accumulation: 8

# Learning rate and optimization
lr: 3e-4
weight_decay: 0.01
warmup_steps: 50
lr_scheduler_type: cosine

# Training duration
epochs: 1
max_training_steps: 2000

# Logging and checkpointing
log_interval: 10
checkpoint_interval: 200

# Output directory
results_dir: /outputs

# Random seed for reproducibility
random_seed: 9024309

# Gradient checkpointing (memory optimization)
enable_gradient_checkpointing: false
gradient_checkpointing_opts:
  use_reentrant: false

# Distributed training
ddp_unused_params: false

# bfloat16, float16, or null for auto-detection
precision: null
